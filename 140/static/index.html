<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova | Smart AIML Assistant</title>
  <style>
    :root { --ink: #17212b; --muted: #6f7b83; --paper: #f5f1e8; --panel: #fffdf8; --line: #e4ddd0; --accent: #ef6a45; --accent-dark: #c84c2e; --blue: #377d8d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 10% 0%, #fff8d9 0, transparent 30%), linear-gradient(135deg, #f5f1e8, #e8f1ee); font-family: Georgia, 'Times New Roman', serif; }
    .shell { width: min(1060px, calc(100% - 32px)); margin: 0 auto; padding: 38px 0 28px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent-dark); font: 700 12px/1.2 'Trebuchet MS', sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(40px, 7vw, 76px); line-height: .9; letter-spacing: -2px; font-weight: 500; }
    .tagline { max-width: 255px; margin: 0; color: var(--muted); font: 15px/1.45 'Trebuchet MS', sans-serif; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 280px; min-height: 620px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); box-shadow: 12px 12px 0 rgba(23,33,43,.08); }
    .chat { display: flex; flex-direction: column; min-width: 0; }
    .chat-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); font: 700 14px 'Trebuchet MS', sans-serif; }
    .status { display: inline-flex; align-items: center; gap: 8px; color: var(--blue); font-size: 12px; font-weight: 400; }
    .status:before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #57aa78; box-shadow: 0 0 0 4px #e0f2e5; }
    #messages { flex: 1; overflow: auto; padding: 24px; }
    .message { display: flex; gap: 12px; margin: 0 0 22px; animation: rise .35s ease both; }
    .message.user { justify-content: flex-end; }
    .bubble { max-width: min(76%, 530px); padding: 14px 17px; border-radius: 2px 16px 16px 16px; background: #f0eee8; font-size: 17px; line-height: 1.45; white-space: pre-wrap; }
    .user .bubble { border-radius: 16px 2px 16px 16px; color: white; background: var(--accent); }
    .avatar { flex: 0 0 32px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: white; background: var(--blue); font: 700 13px 'Trebuchet MS', sans-serif; }
    .composer { display: flex; gap: 10px; padding: 18px; border-top: 1px solid var(--line); }
    #input { flex: 1; min-width: 0; border: 1px solid var(--line); padding: 14px 15px; color: var(--ink); background: #fbfaf6; outline: none; font: 16px Georgia, serif; }
    #input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #dceef0; }
    button { border: 0; padding: 0 20px; color: white; background: var(--ink); font: 700 13px 'Trebuchet MS', sans-serif; cursor: pointer; }
    button:hover { background: var(--blue); }
    aside { padding: 28px 23px; border-left: 1px solid var(--line); background: #f8f4ea; }
    aside h2 { margin: 0 0 21px; font-size: 24px; font-weight: 500; }
    .prompt { width: 100%; margin: 0 0 10px; padding: 13px 14px; color: var(--ink); border: 1px solid var(--line); background: transparent; text-align: left; font: 15px Georgia, serif; }
    .prompt:hover { border-color: var(--accent); color: var(--accent-dark); background: #fffdf8; }
    .note { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font: 13px/1.55 'Trebuchet MS', sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 720px) { .shell { width: min(100% - 20px, 560px); padding-top: 24px; } header { display: block; } .tagline { margin-top: 15px; } .workspace { display: block; min-height: 0; } #messages { min-height: 390px; max-height: 55vh; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">A small thinking machine</p><h1>Nova</h1></div><p class="tagline">A friendly assistant built from readable AIML rules, with a little practical intelligence on top.</p></header>
    <section class="workspace">
      <div class="chat"><div class="chat-top"><span>Conversation</span><span class="status">AIML kernel online</span></div><div id="messages" aria-live="polite"></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Ask Nova something..." aria-label="Message Nova"><button type="submit">Send</button></form></div>
      <aside><h2>Try asking</h2><button class="prompt">What can you do?</button><button class="prompt">What time is it?</button><button class="prompt">Calculate 18 * 7</button><button class="prompt">Tell me your name</button><p class="note">Nova's personality lives in <strong>aiml/brain.aiml</strong>. Add categories there to teach new responses without touching the server.</p></aside>
    </section>
  </main>
  <script>
    const messages = document.querySelector('#messages');
    const input = document.querySelector('#input');
    const form = document.querySelector('#form');
    function addMessage(text, role) { const row = document.createElement('div'); row.className = `message ${role}`; row.innerHTML = role === 'assistant' ? `<div class="avatar">N</div><div class="bubble"></div>` : '<div class="bubble"></div>'; row.querySelector('.bubble').textContent = text; messages.appendChild(row); messages.scrollTop = messages.scrollHeight; }
    async function ask(text) { addMessage(text, 'user'); input.value = ''; input.disabled = true; try { const response = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: text}) }); const data = await response.json(); addMessage(data.reply || data.error, 'assistant'); } catch { addMessage('I could not reach the local assistant. Is the server still running?', 'assistant'); } finally { input.disabled = false; input.focus(); } }
    form.addEventListener('submit', event => { event.preventDefault(); if (input.value.trim()) ask(input.value.trim()); });
    document.querySelectorAll('.prompt').forEach(button => button.addEventListener('click', () => ask(button.textContent)));
    addMessage('Hello! I am Nova. Ask me anything from the suggestions, or teach me a new AIML response.', 'assistant');
  </script>
</body>
</html>
